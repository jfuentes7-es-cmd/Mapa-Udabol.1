<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Campus UDABOL</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Buscador Moderno */
        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 460px;
            background: rgba(15, 23, 42, 0.92);
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .search-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .search-header h2 {
            font-size: 15px;
            color: #f8fafc;
            font-weight: 600;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        .btn-buscar {
            background: linear-gradient(135deg, #800000, #b22222);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-limpiar {
            background: rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            display: none;
        }

        /* Botón GPS Flotante */
        .btn-gps {
            position: absolute;
            bottom: 110px;
            right: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            color: #38bdf8;
            border: 1.5px solid #38bdf8;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .btn-gps:active {
            transform: scale(0.92);
        }

        /* Estilos del Punto Azul de Ubicación GPS */
        .user-location-marker {
            width: 16px;
            height: 16px;
            background-color: #007aff;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(0, 122, 255, 0.8);
        }

        /* Etiquetas fijas */
        .etiqueta-ambiente {
            background: rgba(15, 23, 42, 0.88);
            color: #f8fafc;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Card Inferior Informativa */
        .info-card {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 460px;
            background: rgba(15, 23, 42, 0.95);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border-left: 4px solid #38bdf8;
            color: #fff;
            display: none;
        }

        .info-card h3 {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .info-card p {
            color: #cbd5e1;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="search-header">
            <h2>🎓 UDABOL Campus Sacaba</h2>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Ej. Aula S1, Cajas, Biblioteca...">
            <button class="btn-buscar" onclick="buscarDestino()">Ir</button>
            <button class="btn-limpiar" id="btnLimpiar" onclick="restablecerMapa()">Ver todo</button>
        </div>
    </div>

    <!-- Botón Mi Ubicación GPS -->
    <button class="btn-gps" onclick="centrarEnUsuario()" title="Mi Ubicación">🎯</button>

    <div class="info-card" id="infoCard">
        <h3 id="cardTitulo">Lugar Seleccionado</h3>
        <p id="cardDetalle">Ubicación exacta identificada en el plano.</p>
    </div>

    <div id="map"></div>

    <!-- Leaflet & Omnivore JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

    <script>
        const map = L.map('map', { maxZoom: 21 }).setView([-17.3918, -66.0692], 18);

        // Capa Satelital Esri HD
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 21,
            maxNativeZoom: 19,
            attribution: '© ESRI World Imagery — UDABOL'
        }).addTo(map);

        let elementosEstructura = [];
        let elementosRutas = [];
        let userMarker = null;
        let userCircle = null;
        let userLatLng = null;

        // Cargar archivo KML
        const kmlLayer = omnivore.kml('mapa.kml')
            .on('ready', function() {
                map.fitBounds(kmlLayer.getBounds(), { padding: [30, 30] });

                kmlLayer.eachLayer(function(layer) {
                    const nombre = layer.feature && layer.feature.properties ? layer.feature.properties.name : "";

                    if (layer instanceof L.Polygon) {
                        layer.setStyle({
                            color: '#38bdf8',
                            fillColor: '#800000',
                            fillOpacity: 0.55,
                            weight: 2
                        });

                        if (nombre) {
                            layer.bindTooltip(nombre, {
                                permanent: true,
                                direction: 'center',
                                className: 'etiqueta-ambiente'
                            });
                        }
                        elementosEstructura.push({ layer: layer, nombre: nombre.toLowerCase() });
                    } 
                    else if (layer instanceof L.Polyline) {
                        layer.setStyle({
                            color: '#00F5FF',
                            weight: 5,
                            opacity: 0.9,
                            dashArray: '6, 8'
                        });
                        map.removeLayer(layer);
                        elementosRutas.push({ layer: layer, nombre: nombre.toLowerCase() });
                    }
                });
            })
            .addTo(map);

        // --- LÓGICA DE GEOLOCALIZACIÓN GPS ---
        map.locate({ setView: false, watch: true, enableHighAccuracy: true });

        map.on('locationfound', function(e) {
            userLatLng = e.latlng;
            const radius = e.accuracy / 2;

            if (userMarker) {
                userMarker.setLatLng(e.latlng);
                userCircle.setLatLng(e.latlng).setRadius(radius);
            } else {
                // Crear el punto azul personalizado
                const userIcon = L.divIcon({
                    className: 'user-location-marker',
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });
                userMarker = L.marker(e.latlng, { icon: userIcon }).addTo(map).bindPopup("¡Estás aquí!");
                userCircle = L.circle(e.latlng, { radius: radius, color: '#007aff', opacity: 0.2, fillColor: '#007aff', fillOpacity: 0.1 }).addTo(map);
            }
        });

        map.on('locationerror', function(e) {
            console.log("Acceso a GPS no otorgado o no disponible.");
        });

        function centrarEnUsuario() {
            if (userLatLng) {
                map.setView(userLatLng, 19);
                if (userMarker) userMarker.openPopup();
            } else {
                alert("Activa el GPS de tu celular y permite el acceso a la ubicación en el navegador.");
            }
        }

        // BÚSQUEDA Y CÁLCULO DE DISTANCIA
        function buscarDestino() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) return;

            let hallado = false;
            let destinoLatLng = null;

            elementosRutas.forEach(item => map.removeLayer(item.layer));

            elementosEstructura.forEach(item => {
                if (item.nombre.includes(query)) {
                    hallado = true;
                    destinoLatLng = item.layer.getBounds().getCenter();

                    item.layer.setStyle({
                        color: '#00FF66',
                        fillColor: '#00FF66',
                        fillOpacity: 0.75,
                        weight: 3
                    });

                    map.fitBounds(item.layer.getBounds(), { padding: [80, 80] });

                    // Calcular distancia si la ubicación GPS está activa
                    let textoDistancia = "Visualizando este espacio en el plano.";
                    if (userLatLng && destinoLatLng) {
                        const metros = Math.round(userLatLng.distanceTo(destinoLatLng));
                        textoDistancia = `Estás a aprox. <strong>${metros} metros</strong> de este lugar.`;
                    }

                    document.getElementById('infoCard').style.display = 'block';
                    document.getElementById('cardTitulo').innerText = `Ubicación: ${item.layer.feature.properties.name}`;
                    document.getElementById('cardDetalle').innerHTML = textoDistancia;
                } else {
                    item.layer.setStyle({ fillOpacity: 0.2, weight: 1 });
                }
            });

            elementosRutas.forEach(item => {
                if (item.nombre.includes(query)) {
                    map.addLayer(item.layer);
                }
            });

            if (hallado) {
                document.getElementById('btnLimpiar').style.display = 'inline-block';
            } else {
                alert('No se encontró el ambiente. Verifica el nombre ingresado.');
            }
        }

        function restablecerMapa() {
            elementosRutas.forEach(item => map.removeLayer(item.layer));
            elementosEstructura.forEach(item => {
                item.layer.setStyle({
                    color: '#38bdf8',
                    fillColor: '#800000',
                    fillOpacity: 0.55,
                    weight: 2
                });
            });

            document.getElementById('infoCard').style.display = 'none';
            document.getElementById('btnLimpiar').style.display = 'none';
            document.getElementById('searchInput').value = '';
            map.fitBounds(kmlLayer.getBounds(), { padding: [30, 30] });
        }
    </script>
</body>
</html>
