<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo UDABOL - Cochabamba</title>

    <!-- Hojas de estilo de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #111;
        }

        /* Buscador flotante elegante */
        .search-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.95);
            padding: 14px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
        }

        .search-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .search-header h2 {
            font-size: 16px;
            color: #800000;
            font-weight: 700;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #800000;
        }

        .btn-buscar {
            background: #800000;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-limpiar {
            background: #f0f0f0;
            color: #444;
            border: 1px solid #ccc;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        /* Etiquetas en el mapa */
        .etiqueta-mapa {
            background: rgba(128, 0, 0, 0.9);
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        /* Panel Informativo de la Ruta Activa */
        .info-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 440px;
            background: white;
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            display: none;
            border-left: 5px solid #00E5FF;
        }

        .info-panel h3 {
            color: #800000;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .info-panel p {
            color: #555;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="search-header">
            <h2>📍 Campus UDABOL Sacaba</h2>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="¿A dónde quieres ir? (ej. Cajas, CC-4)">
            <button class="btn-buscar" onclick="buscarDestino()">Ir</button>
            <button class="btn-limpiar" id="btnLimpiar" onclick="limpiarRutas()">Borrar ruta</button>
        </div>
    </div>

    <div class="info-panel" id="infoPanel">
        <h3 id="rutaTitulo">Destino seleccionado</h3>
        <p id="rutaDetalle">Sigue la línea azul para llegar desde el ingreso principal.</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

    <script>
        // Inicializar mapa centrado en el campus con zoom HD
        const map = L.map('map', { maxZoom: 21 }).setView([-17.3918, -66.0692], 18);

        // Capa Satelital Esri HD
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 21,
            maxNativeZoom: 19,
            attribution: '© Esri Satelital — UDABOL'
        }).addTo(map);

        let capasEstructuras = [];
        let capasRutas = [];

        // Cargar KML
        const kmlLayer = omnivore.kml('mapa.kml')
            .on('ready', function() {
                map.fitBounds(kmlLayer.getBounds());

                kmlLayer.eachLayer(function(layer) {
                    const nombre = layer.feature && layer.feature.properties ? layer.feature.properties.name : "";

                    // Si es un Edificio / Polígono
                    if (layer instanceof L.Polygon) {
                        layer.setStyle({
                            color: '#FFD700',
                            fillColor: '#800000',
                            fillOpacity: 0.5,
                            weight: 2
                        });

                        if (nombre) {
                            layer.bindTooltip(nombre, {
                                permanent: true,
                                direction: 'center',
                                className: 'etiqueta-mapa'
                            });
                        }
                        capasEstructuras.push(layer);
                    } 
                    // Si es una Ruta / Línea
                    else if (layer instanceof L.Polyline) {
                        layer.setStyle({
                            color: '#00E5FF',
                            weight: 6,
                            opacity: 0.9,
                            dashArray: '8, 10'
                        });

                        // OCULTAR la ruta al iniciar
                        map.removeLayer(layer);
                        capasRutas.push({ layer: layer, nombre: nombre.toLowerCase() });
                    }
                });
            })
            .addTo(map);

        // Función de Búsqueda y Filtrado Exclusivo de Rutas
        function buscarDestino() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) return;

            let rutaEncontrada = false;

            // 1. Ocultar todas las rutas activas previas
            capasRutas.forEach(r => map.removeLayer(r.layer));

            // 2. Mostrar SOLAMENTE la ruta que coincida con la búsqueda
            capasRutas.forEach(r => {
                if (r.nombre.includes(query)) {
                    map.addLayer(r.layer);
                    map.fitBounds(r.layer.getBounds(), { padding: [50, 50] });
                    rutaEncontrada = true;

                    // Actualizar interfaz
                    document.getElementById('infoPanel').style.display = 'block';
                    document.getElementById('btnLimpiar').style.display = 'inline-block';
                    document.getElementById('rutaTitulo').innerText = `Ruta hacia: ${document.getElementById('searchInput').value}`;
                    document.getElementById('rutaDetalle').innerText = `Visualizando únicamente el camino seleccionado.`;
                }
            });

            // Si no se encuentra como nombre de ruta, buscar en los bloques/aulas
            if (!rutaEncontrada) {
                capasEstructuras.forEach(layer => {
                    const nombreLayer = layer.feature.properties.name ? layer.feature.properties.name.toLowerCase() : "";
                    if (nombreLayer.includes(query)) {
                        map.fitBounds(layer.getBounds(), { padding: [50, 50] });
                        rutaEncontrada = true;
                        document.getElementById('infoPanel').style.display = 'block';
                        document.getElementById('btnLimpiar').style.display = 'inline-block';
                        document.getElementById('rutaTitulo').innerText = `Ubicación: ${layer.feature.properties.name}`;
                        document.getElementById('rutaDetalle').innerText = `Ubicación destacada en el mapa.`;
                    }
                });
            }

            if (!rutaEncontrada) {
                alert('No se encontró una ruta o ambiente con ese nombre. Revisa cómo la nombraste en Google Earth.');
            }
        }

        // Función para limpiar la pantalla y volver al mapa general
        function limpiarRutas() {
            capasRutas.forEach(r => map.removeLayer(r.layer));
            document.getElementById('infoPanel').style.display = 'none';
            document.getElementById('btnLimpiar').style.display = 'none';
            document.getElementById('searchInput').value = '';
            map.fitBounds(kmlLayer.getBounds());
        }
    </script>
</body>
</html>
