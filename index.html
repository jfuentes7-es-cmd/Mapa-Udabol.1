<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo UDABOL - Cochabamba</title>

    <!-- Hojas de estilo de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #111; /* Fondo oscuro por si carga */
        }

        /* Buscador flotante */
        .search-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        .search-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .search-header h2 {
            font-size: 16px;
            color: #800000;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        button {
            background: #800000;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #600000;
        }

        /* Etiquetas fijas con el nombre de cada aula/ambiente */
        .etiqueta-mapa {
            background: rgba(128, 0, 0, 0.85);
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 6px;
            padding: 3px 7px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        /* Panel de información inferior */
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
        }

        .info-panel h3 {
            color: #800000;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .info-panel p {
            color: #444;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="search-header">
            📍 <h2>UDABOL Campus Sacaba</h2>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="¿A dónde vas? (ej. Cafetería, CC-4, Cajas)">
            <button onclick="buscarDestino()">Ir</button>
        </div>
    </div>

    <div class="info-panel" id="infoPanel">
        <h3 id="rutaTitulo">Ubicación seleccionada</h3>
        <p id="rutaDetalle">Sigue las indicaciones en pantalla.</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

    <script>
        // Inicializar mapa centrado en UDABOL con zoom máximo ampliado a 21
        const map = L.map('map', {
            maxZoom: 21
        }).setView([-17.3918, -66.0692], 18);

        // Capa Satelital Esri HD (Permite ver los edificios y aulas reales sin desaparecer al zoom)
        const satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 21,
            maxNativeZoom: 19,
            attribution: '© Esri Satelital — UDABOL'
        }).addTo(map);

        // Cargar KML y agregar etiquetas fijas sobre las aulas
        const kmlLayer = omnivore.kml('mapa.kml')
            .on('ready', function() {
                map.fitBounds(kmlLayer.getBounds());
                
                kmlLayer.eachLayer(function(layer) {
                    const nombre = layer.feature && layer.feature.properties ? layer.feature.properties.name : null;

                    // Estilo de los bloques y aulas (polígonos)
                    if (layer instanceof L.Polygon) {
                        layer.setStyle({
                            color: '#FFD700',      // Borde amarillo brillante
                            fillColor: '#800000',  // Relleno Guindo UDABOL
                            fillOpacity: 0.5,
                            weight: 2
                        });
                    } 
                    // Estilo de los pasillos/rutas (líneas)
                    else if (layer instanceof L.Polyline) {
                        layer.setStyle({
                            color: '#00FFFF',      // Azul cian brillante para ver los pasillos claro sobre el satélite
                            weight: 5,
                            dashArray: '6, 8'
                        });
                    }

                    // Agregar etiqueta visible permanentemente con el nombre del ambiente
                    if (nombre) {
                        layer.bindTooltip(nombre, {
                            permanent: true,
                            direction: 'center',
                            className: 'etiqueta-mapa'
                        });
                    }
                });
            })
            .addTo(map);

        // Búsqueda inteligente de ambiente o aula
        function buscarDestino() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) return;

            let encontrado = false;

            kmlLayer.eachLayer(function(layer) {
                if (layer.feature && layer.feature.properties && layer.feature.properties.name) {
                    const nombre = layer.feature.properties.name.toLowerCase();
                    if (nombre.includes(query)) {
                        encontrado = true;
                        
                        if (layer.getBounds) {
                            map.fitBounds(layer.getBounds());
                        } else if (layer.getLatLng) {
                            map.setView(layer.getLatLng(), 20);
                        }

                        layer.openTooltip();

                        document.getElementById('infoPanel').style.display = 'block';
                        document.getElementById('rutaTitulo').innerText = `Ubicación: ${layer.feature.properties.name}`;
                        document.getElementById('rutaDetalle').innerText = `Haz hecho zoom sobre este ambiente en el mapa.`;
                    }
                }
            });

            if (!encontrado) {
                alert('No se encontró ese punto. Asegúrate de haberlo dibujado y nombrado en Google Earth Pro.');
            }
        }
    </script>
</body>
</html>
