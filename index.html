<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Campus UDABOL</title>

    <!-- Hojas de estilo de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Buscador Moderno */
        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 460px;
            background: rgba(15, 23, 42, 0.92);
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .search-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .search-header h2 {
            font-size: 15px;
            color: #f8fafc;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 14px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-buscar {
            background: linear-gradient(135deg, #800000, #b22222);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(128, 0, 0, 0.4);
            transition: transform 0.2s;
        }

        .btn-buscar:active {
            transform: scale(0.96);
        }

        .btn-limpiar {
            background: rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: none;
        }

        /* Etiquetas fijas sobre los ambientes */
        .etiqueta-ambiente {
            background: rgba(15, 23, 42, 0.88);
            color: #f8fafc;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        /* Card Inferior Informativa */
        .info-card {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 460px;
            background: rgba(15, 23, 42, 0.95);
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border-left: 4px solid #38bdf8;
            color: #fff;
            display: none;
        }

        .info-card h3 {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .info-card p {
            color: #cbd5e1;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="search-header">
            <h2>🎓 UDABOL Campus Sacaba</h2>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Ej. Aula S1, Cajas, Biblioteca...">
            <button class="btn-buscar" onclick="buscarDestino()">Ir</button>
            <button class="btn-limpiar" id="btnLimpiar" onclick="restablecerMapa()">Ver todo</button>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <h3 id="cardTitulo">Lugar Seleccionado</h3>
        <p id="cardDetalle">Ubicación exacta identificada en el plano.</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

    <script>
        const map = L.map('map', { maxZoom: 21 }).setView([-17.3918, -66.0692], 18);

        // Capa Satelital ESRI HD limpia
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 21,
            maxNativeZoom: 19,
            attribution: '© ESRI World Imagery — UDABOL'
        }).addTo(map);

        let elementosEstructura = [];
        let elementosRutas = [];

        // Cargar archivo KML
        const kmlLayer = omnivore.kml('mapa.kml')
            .on('ready', function() {
                map.fitBounds(kmlLayer.getBounds(), { padding: [30, 30] });

                kmlLayer.eachLayer(function(layer) {
                    const nombre = layer.feature && layer.feature.properties ? layer.feature.properties.name : "";

                    // AULAS / ESPACIOS / POLÍGONOS
                    if (layer instanceof L.Polygon) {
                        layer.setStyle({
                            color: '#38bdf8',      // Borde azul celeste estético
                            fillColor: '#800000',  // Relleno guindo UDABOL
                            fillOpacity: 0.55,
                            weight: 2
                        });

                        if (nombre) {
                            layer.bindTooltip(nombre, {
                                permanent: true,
                                direction: 'center',
                                className: 'etiqueta-ambiente'
                            });
                        }
                        elementosEstructura.push({ layer: layer, nombre: nombre.toLowerCase() });
                    } 
                    // RUTAS / LÍNEAS PEATONALES
                    else if (layer instanceof L.Polyline) {
                        layer.setStyle({
                            color: '#00F5FF',      // Cian Neón
                            weight: 5,
                            opacity: 0.9,
                            dashArray: '6, 8'
                        });

                        // Ocultar rutas al inicio
                        map.removeLayer(layer);
                        elementosRutas.push({ layer: layer, nombre: nombre.toLowerCase() });
                    }
                });
            })
            .addTo(map);

        // BÚSQUEDA Y AISLAMIENTO DE AMBIENTE
        function buscarDestino() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) return;

            let hallado = false;

            // 1. Ocultar todas las rutas activas
            elementosRutas.forEach(item => map.removeLayer(item.layer));

            // 2. Filtrar ambientes y resaltar SOLO el coincidente
            elementosEstructura.forEach(item => {
                if (item.nombre.includes(query)) {
                    hallado = true;

                    // Estilo de Resaltado para la zona encontrada
                    item.layer.setStyle({
                        color: '#00FF66',     // Borde verde neón brillante
                        fillColor: '#00FF66',
                        fillOpacity: 0.75,
                        weight: 3
                    });

                    map.fitBounds(item.layer.getBounds(), { padding: [80, 80] });

                    // Mostrar Card informativa
                    document.getElementById('infoCard').style.display = 'block';
                    document.getElementById('cardTitulo').innerText = `Ubicación: ${item.layer.feature.properties.name}`;
                    document.getElementById('cardDetalle').innerText = `Visualizando únicamente este espacio en el mapa.`;
                } else {
                    // Atenuar los demás ambientes para no distraer
                    item.layer.setStyle({
                        fillOpacity: 0.2,
                        weight: 1
                    });
                }
            });

            // 3. Encender la ruta correspondiente si existe
            elementosRutas.forEach(item => {
                if (item.nombre.includes(query)) {
                    map.addLayer(item.layer);
                }
            });

            if (hallado) {
                document.getElementById('btnLimpiar').style.display = 'inline-block';
            } else {
                alert('No se encontró el ambiente. Verifica que esté dibujado como un polígono con ese nombre en tu KML.');
            }
        }

        // RESTABLECER VISTA GENERAL
        function restablecerMapa() {
            // Ocultar rutas
            elementosRutas.forEach(item => map.removeLayer(item.layer));

            // Restaurar estilo normal de todos los ambientes
            elementosEstructura.forEach(item => {
                item.layer.setStyle({
                    color: '#38bdf8',
                    fillColor: '#800000',
                    fillOpacity: 0.55,
                    weight: 2
                });
            });

            document.getElementById('infoCard').style.display = 'none';
            document.getElementById('btnLimpiar').style.display = 'none';
            document.getElementById('searchInput').value = '';

            map.fitBounds(kmlLayer.getBounds(), { padding: [30, 30] });
        }
    </script>
</body>
</html>
